<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;background:#0d1728;color:#dce8f8;font:14px system-ui,sans-serif}.shell{border:1px solid #28374c;border-radius:14px;overflow:hidden}.tools{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid #28374c;flex-wrap:wrap}button{background:#182840;color:#e5eefb;border:1px solid #3b526d;border-radius:6px;padding:8px 12px;cursor:pointer;font:inherit}button:hover{background:#244260}button:focus-visible,[tabindex]:focus-visible{outline:3px solid #55e0d0}.hint{color:#a2b7d0;margin-left:auto;font-size:13px}.work{display:grid;grid-template-columns:minmax(0,1fr) 230px}svg{width:100%;height:500px;touch-action:none;background:radial-gradient(ellipse at center,#132b40,#0b1424)}aside{padding:18px;border-left:1px solid #28374c;overflow-wrap:anywhere}aside h2{margin:10px 0;font-size:21px}aside p{color:#a9bad0;line-height:1.6}.eyebrow{font-size:12px;letter-spacing:1.8px;color:#55dac9}.stat{font-size:30px;font-weight:700;margin:18px 0 4px}.legend{display:flex;gap:18px;padding:12px 16px;border-top:1px solid #28374c;font-size:13px;flex-wrap:wrap}.legend span::before{content:'●';color:var(--c);margin-right:6px}g.node{cursor:pointer}g.node text{pointer-events:none;paint-order:stroke;stroke:#0b1424;stroke-width:5px;stroke-linejoin:round;fill:#e9f1ff;font-size:13px}.edge{fill:none;stroke:#6986a7;stroke-opacity:.45}.edge.active{stroke:#58e4d0;stroke-opacity:1}.dim{opacity:.16} .node circle,.node rect{stroke:#0b1424;stroke-width:3}@media(max-width:650px){.work{grid-template-columns:1fr}aside{border-left:0;border-top:1px solid #28374c}svg{height:400px}}
</style><div class="shell"><div class="tools"><button id="plus" aria-label="Zoom in">＋</button><button id="minus" aria-label="Zoom out">−</button><button id="reset">Fit graph</button><button id="clear">Clear highlight</button><span class="hint">Select a node or link · Drag nodes · Scroll to zoom</span></div><div class="work"><svg id="graph" viewBox="0 0 800 500" aria-label="Interactive transaction network"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7597ba"/></marker><pattern id="dots" width="25" height="25" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#284057"/></pattern></defs><rect width="800" height="500" fill="url(#dots)"/><g id="scene"></g></svg><aside id="detail" aria-live="polite"></aside></div><div class="legend"><span style="--c:#59dfca">Selected wallet</span><span style="--c:#f87889">Critical / high</span><span style="--c:#f6bb62">Medium</span><span style="--c:#679cdd">Low</span><span style="--c:#b698ee">Network observation</span><span style="--c:#f6c66a">Square: transaction</span></div></div>
<script>
const data=__GRAPH_DATA__;
const svg=document.getElementById('graph'),scene=document.getElementById('scene'),detail=document.getElementById('detail'),NS='http://www.w3.org/2000/svg';let scale=1,dx=0,dy=0,drag=null,moved=false;
const nodes=new Map(data.nodes.map(n=>[n.id,n]));const colors={CRITICAL:'#f87889',HIGH:'#f87889',MEDIUM:'#f6bb62',LOW:'#679cdd',UNKNOWN:'#8796a9'};
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));if(parent)parent.appendChild(e);return e}
function line(text,tag='p'){const e=document.createElement(tag);e.textContent=text;detail.appendChild(e);return e}
function inspect(n){detail.replaceChildren();line(n.kind==='ip'?'NETWORK OBSERVATION':n.kind==='transaction'?'TRANSACTION':'WALLET DETAILS').className='eyebrow';line(n.id,'h2');if(n.kind!=='ip'){line(n.risk==null?'Unscored':n.risk.toFixed(2),'div').className='stat';line('Risk score / 100 · '+n.level);line(n.count+' transactions in this view');line(n.volume.toFixed(6)+' BTC in this view');line(n.evidence||'No stored risk evidence.');}else{line(n.count+' associated observations');line('Observed alongside transactions. This does not establish wallet ownership.');}line('Connected links are highlighted.');scene.querySelectorAll('.node').forEach(e=>e.classList.toggle('dim',e.dataset.id!==n.id&&!data.edges.some(v=>(v.source===n.id&&v.target===e.dataset.id)||(v.target===n.id&&v.source===e.dataset.id))));scene.querySelectorAll('.edge').forEach(e=>{const v=data.edges[+e.dataset.index];e.classList.toggle('active',v.source===n.id||v.target===n.id);e.classList.toggle('dim',v.source!==n.id&&v.target!==n.id)});}
function inspectEdge(e){detail.replaceChildren();line(e.kind==='observation'?'OBSERVED ASSOCIATION':'TRANSFER DIRECTION').className='eyebrow';line(e.source+' → '+e.target,'h2');line(e.count+' transaction records');if(e.kind!=='observation')line(e.amount.toFixed(6)+' BTC','h2');line('First: '+e.first);line('Last: '+e.last);if(e.kind==='observation')line('Network metadata association only; no identity or calibrated confidence is inferred.');}
function edgePath(e){const a=nodes.get(e.source),b=nodes.get(e.target),vx=b.x-a.x,vy=b.y-a.y,len=Math.hypot(vx,vy)||1,ux=vx/len,uy=vy/len;if(a===b)return `M ${a.x-10} ${a.y-17} C ${a.x-60} ${a.y-85},${a.x+60} ${a.y-85},${a.x+12} ${a.y-17}`;const bend=data.edges.some(z=>z.source===e.target&&z.target===e.source)?18:0;return `M ${a.x+ux*23} ${a.y+uy*23} Q ${(a.x+b.x)/2-uy*bend} ${(a.y+b.y)/2+ux*bend} ${b.x-ux*26} ${b.y-uy*26}`;}
function positions(){scene.querySelectorAll('.edge').forEach(p=>p.setAttribute('d',edgePath(data.edges[+p.dataset.index])));scene.querySelectorAll('.node').forEach(g=>{const n=nodes.get(g.dataset.id);g.setAttribute('transform',`translate(${n.x},${n.y})`)})}
data.edges.forEach((e,i)=>{const p=el('path',{class:'edge',d:edgePath(e),'data-index':i,'stroke-width':Math.min(5,1.2+Math.log1p(e.count)), 'marker-end':e.kind==='observation'?'':'url(#arrow)',tabindex:0,role:'button','aria-label':e.source+' to '+e.target},scene);if(e.kind==='observation')p.setAttribute('stroke-dasharray','5 5');p.addEventListener('pointerdown',x=>x.stopPropagation());p.addEventListener('click',()=>inspectEdge(e));p.addEventListener('keydown',x=>{if(x.key==='Enter')inspectEdge(e)})});
data.nodes.forEach(n=>{const g=el('g',{class:'node','data-id':n.id,transform:`translate(${n.x},${n.y})`,tabindex:0,role:'button','aria-label':n.id+' '+n.level},scene);if(n.id===data.center)el('circle',{r:30,fill:'#59dfca','fill-opacity':'.12',stroke:'#59dfca'},g);if(n.kind==='ip'||n.kind==='transaction')el('rect',{x:-16,y:-16,width:32,height:32,rx:7,fill:n.kind==='transaction'?'#f6c66a':'#b698ee'},g);else el('circle',{r:n.id===data.center?22:17,fill:n.id===data.center?'#59dfca':colors[n.level]||colors.UNKNOWN},g);const t=el('text',{y:38,'text-anchor':'middle'},g);t.textContent=n.id.length>18?n.id.slice(0,8)+'…'+n.id.slice(-5):n.id;g.addEventListener('click',()=>{if(!moved)inspect(n)});g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();inspect(n)}});g.addEventListener('pointerdown',e=>{e.stopPropagation();moved=false;drag={node:n,startX:e.clientX,startY:e.clientY};svg.setPointerCapture(e.pointerId)})});
function transform(){scene.setAttribute('transform',`translate(${dx},${dy}) scale(${scale})`)}function zoom(f){scale=Math.max(.35,Math.min(3,scale*f));transform()}document.getElementById('plus').onclick=()=>zoom(1.2);document.getElementById('minus').onclick=()=>zoom(1/1.2);document.getElementById('reset').onclick=()=>{scale=1;dx=dy=0;transform()};document.getElementById('clear').onclick=()=>{scene.querySelectorAll('.dim,.active').forEach(e=>e.classList.remove('dim','active'));detail.replaceChildren();line('NETWORK EXPLORER').className='eyebrow';line(data.center,'h2');line(data.nodes.length+' nodes · '+data.edges.length+' links');line('Arrowheads show transfer direction. Select a node or link to inspect its evidence.');};svg.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.08:1/1.08)},{passive:false});svg.addEventListener('pointerdown',e=>{drag={startX:e.clientX,startY:e.clientY,dx,dy};svg.setPointerCapture(e.pointerId)});svg.addEventListener('pointermove',e=>{if(!drag)return;const rect=svg.getBoundingClientRect(),factor=800/rect.width;moved=Math.abs(e.clientX-drag.startX)+Math.abs(e.clientY-drag.startY)>4;if(drag.node){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(scene.getScreenCTM().inverse());drag.node.x=q.x;drag.node.y=q.y;positions()}else{dx=drag.dx+(e.clientX-drag.startX)*factor;dy=drag.dy+(e.clientY-drag.startY)*factor;transform()}});svg.addEventListener('pointerup',()=>{if(drag&&drag.node&&!moved)inspect(drag.node);drag=null;setTimeout(()=>moved=false,100)});svg.addEventListener('pointercancel',()=>drag=null);inspect(nodes.get(data.center));
</script></html>
